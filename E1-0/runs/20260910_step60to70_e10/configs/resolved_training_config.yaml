    shuffle: false
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: false
    entropy_checkpointing: false
    checkpoint:
      save_contents:
      - model
      - optimizer
      - extra
      load_contents:
      - model
      - optimizer
      - extra
    optim:
      lr: 1.0e-06
      lr_warmup_steps: 3
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      num_cycles: 0.5
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.1
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
      forward_prefetch: false
      timeout: 120
    profiler:
      discrete: false
      all_ranks: false
      ranks: null
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: true
      reshard_after_forward: true
      forward_prefetch: false
      wrap_policy:
        min_num_params: 0
    use_torch_compile: true
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 10240
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: false
    entropy_checkpointing: false
    profiler:
      discrete: false
      all_ranks: false
      ranks: null
  rollout:
    name: sglang_async
    mode: sync
    temperature: 1.0
    top_k: -1
    top_p: 1
    use_fire_sampling: false
    prompt_length: 2048
    response_length: 8192
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    load_format: dummy_dtensor
    layered_summon: false
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 10240
    max_model_len: 10240
    max_num_seqs: 1024
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 10240
    disable_log_stats: true
    enable_chunked_prefill: true
    do_sample: true
    'n': 8
    engine_kwargs:
      vllm:
        swap_space: null
        disable_mm_preprocessor_cache: false
      sglang:
        attention_backend: null
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0
      'n': 1
      do_sample: false
    multi_turn:
      enable: true
      max_turns: 8
      tool_config_path: /data01/wyy/Graph-Agent-Planning/verl/verl/tools/config/search_tool_config/wiki_rag_config.yaml
      completion_callback: null
      use_inference_chat_template: false
      enable_tokenization_sanity_check: false
      use_xml_tool_parser: true
      format: qwen
    profiler:
      discrete: false
      all_ranks: false
      ranks: null
